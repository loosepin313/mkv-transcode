# Let the status page use its two control buttons.
#
# The page has no login, so the shipped unit keeps the control routes off.
# Turn them on only on a network you trust.
#
# Controls need write access:
#   Process now writes <transcoded>/.control.json.
#   Clear jobs writes the jobs table in <transcoded>/.state.sqlite.
# The main unit sets ProtectSystem=full, so add ReadWritePaths for the library
# folder, or the two routes answer 500.
#
# Install with: sudo mkdir -p /etc/systemd/system/mkv-transcode-status.service.d
#               sudo cp systemd/drop-ins/status-control.conf \
#                 /etc/systemd/system/mkv-transcode-status.service.d/
# Then run: sudo systemctl daemon-reload && sudo systemctl restart mkv-transcode-status
[Service]
ExecStart=
ExecStart=/usr/local/bin/mkv-transcode status-web --host 0.0.0.0 --port 8090 --interval 5 --allow-control
ReadWritePaths=/data/library
