# Let the system service write to the media folders only.
#
# The main unit sets ProtectHome=read-only. Do not replace that with
# ProtectHome=read-write, which gives the service your whole home tree.
# ReadWritePaths adds a writable bind mount for the folders you list, and the
# rest of /home stays read-only.
#
# Edit the paths to match paths.incoming, paths.work, paths.transcoded and
# paths.processed in the config file.
#
# Install with: sudo mkdir -p /etc/systemd/system/mkv-transcode.service.d
#               sudo cp systemd/drop-ins/media-paths.conf \
#                 /etc/systemd/system/mkv-transcode.service.d/media-paths.conf
# Then run: sudo systemctl daemon-reload && sudo systemctl restart mkv-transcode
[Service]
ReadWritePaths=/data/incoming /data/workdir /data/library /data/processed
